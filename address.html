<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Address - Subhoj Ladoos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header compact">
        <div class="logo-container">
            <h1>SUBHOJ Ladoos</h1>
        </div>
    </header>

    <main class="container center-box">
        <div class="card">
            <h2>Delivery Address & Serviceability</h2>
            <p>We deliver across Mumbai, Thane, Palghar, Alibaug, Nashik, and Pune.</p>
            
            <form id="address-form">
                <div class="form-group">
                    <label>House / Flat Number *</label>
                    <input type="text" id="house" required>
                </div>
                <div class="form-group">
                    <label>Building / Society Name *</label>
                    <input type="text" id="building" required>
                </div>
                <div class="form-group">
                    <label>Area / Locality *</label>
                    <input type="text" id="area" required>
                </div>
                <div class="form-group">
                    <label>City *</label>
                    <select id="city" required>
                        <option value="">Select City</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Thane">Thane</option>
                        <option value="Palghar">Palghar</option>
                        <option value="Alibaug">Alibaug</option>
                        <option value="Nashik">Nashik</option>
                        <option value="Pune">Pune</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>PIN Code (Mandatory) *</label>
                    <input type="text" id="pincode" required placeholder="e.g. 400601">
                </div>
                <div id="address-error" class="error-msg"></div>
                <button type="submit" class="btn btn-primary">Validate PIN & Continue</button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
