<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Subhoj Ladoos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header compact">
        <div class="logo-container">
            <h1>SUBHOJ Ladoos</h1>
        </div>
    </header>

    <main class="container center-box">
        <div class="card payment-card">
            <h2>UPI Payment QR Code</h2>
            <p>Scan with any UPI App (GPay / PhonePe / Paytm)</p>
            <div class="qr-placeholder">
                <div class="qr-box">🔲 QR CODE 🔲</div>
                <p><strong>UPI ID:</strong> sureshkumar@oksbi</p>
                <p><strong>Payee:</strong> Suresh Kumar</p>
                <p class="amount-display">Amount: <span id="qr-amount">₹0</span></p>
            </div>

            <div id="timer-box">
                Session expires in: <span id="countdown">30</span>s
            </div>

            <div id="payment-expired-msg" class="error-msg" style="display:none;">
                Session expired. Please refresh payment page to generate a new QR code.
            </div>

            <button id="refresh-qr-btn" class="btn btn-secondary" style="display:none;">Refresh QR</button>
            <button id="simulate-payment-btn" class="btn btn-primary">Simulate Successful Payment</button>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
